<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferretería SEBASTIAN </title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f3f4f6; color: #1f2937; }
    #app { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); text-align: center; max-width: 400px; width: 90%; }
    h1 { margin-bottom: 20px; color: #667eea; }
    p { margin-bottom: 10px; color: #6b7280; }
    .status { margin-top: 20px; padding: 15px; background: #f0fdf4; border: 1px solid #86efac; border-radius: 5px; color: #166534; }
    .error { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>Ferretería SEBASTIAN</h1>
      <p>Sistema 100% Offline</p>
      <div class="status" id="status">Conectando al servidor...</div>
    </div>
  </div>
  <script>
    fetch('/api/health')
      .then(res => res.json())
      .then(data => {
        document.getElementById('status').innerHTML = '✓ Conectado al servidor<br>Redirigiendo...';
        setTimeout(() => { window.location.href = '/login.html'; }, 1500);
      })
      .catch(err => {
        document.getElementById('status').innerHTML = '✗ Error: No se puede conectar<br>' + err.message;
        document.getElementById('status').className = 'status error';
      });
  </script>
</body>
</html>
